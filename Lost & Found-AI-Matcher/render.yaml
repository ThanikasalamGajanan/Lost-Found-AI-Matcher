# Render blueprint for the Lost & Found AI Matcher backend.
# Do NOT put real secrets in this file. Set secret values in the Render dashboard.

services:
  - type: web
    name: lost-found-api
    env: node
    plan: free
    region: ohio
    rootDir: "LostFound-AI-Matcher/backend"
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Replace with your deployed Vercel frontend URL after deploying the frontend.
      - key: FRONTEND_URL
        value: "https://your-vercel-app.vercel.app"
      - key: CORS_ORIGINS
        value: "https://your-vercel-app.vercel.app"
      # Supabase project URL (public, but replace with your real value).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # Supabase anon key (public client key, but replace with your real value).
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Supabase service-role key. MUST be kept secret — set via Render dashboard.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Postgres connection string from Supabase (contains password; keep secret).
      - key: DATABASE_URL
        sync: false
      # OpenAI API key (keep secret).
      - key: OPENAI_API_KEY
        sync: false
      # Resend API key (keep secret).
      - key: RESEND_API_KEY
        sync: false
      # Sender email address used by Resend.
      - key: EMAIL_FROM
        sync: false
      # JWT signing secret (keep secret; generate a strong random string).
      - key: JWT_SECRET
        sync: false
      # Public backend API URL. Used by any shared/client code that reads it.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Internal/backend API URL.
      - key: API_URL
        sync: false
