services:
  - type: web
    name: lost-found-api
    env: node
    plan: free
    region: ohio
    rootDir: "LostFound-AI-Matcher/backend"
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: "https://lost-found-ai-matcher-edyznzk62-mindmeld1.vercel.app"
      - key: CORS_ORIGINS
        value: "https://lost-found-ai-matcher-edyznzk62-mindmeld1.vercel.app,http://localhost:3000"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Use the Supabase connection POOLER URI (Session mode, port 5432,
      # username postgres.<project-ref>@aws-0-<region>.pooler.supabase.com).
      # Do NOT use db.<project-ref>.supabase.co — it is IPv6-only and unreachable
      # from Render's IPv4 egress, which breaks every SQL query with a 500.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: API_URL
        sync: false